[pytest]
# Redirect bytecode cache to a writable temp location.
# This prevents stale .pyc files on the Windows-mounted filesystem from
# silently running old test logic after edits.
cache_dir = /tmp/pytest-revia

# WS-0 — REVIA regression net.
# Scope: the new pytest-based suite under revia_core_py/tests/.
# The legacy top-level test_*.py files (unittest style) are intentionally
# NOT collected here so the two suites do not interfere during the
# remediation. They can be folded in during WS-10.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -p no:cacheprovider -ra --strict-markers
markers =
    smoke: fast end-to-end wiring check (imports the server, exercises routes)
    golden: snapshot/approval test over deterministic pipeline components
    bench: latency benchmark (not run by default CI gate)
